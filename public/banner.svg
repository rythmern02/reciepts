<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#183626" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0d1410" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="28" stdDeviation="32" flood-color="#000" flood-opacity="0.7" />
    </filter>
    <filter id="stamp-rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" />
    </filter>
  </defs>

  <!-- Deep canvas background -->
  <rect width="1200" height="630" fill="#0a0a0a" />
  <rect width="1200" height="630" fill="url(#bg-glow)" />

  <!-- Subtle border -->
  <rect width="1196" height="626" x="2" y="2" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- LEFT: Brand & Value Prop -->
  <g transform="translate(72, 70)">
    <!-- Brand badge -->
    <g>
      <rect width="188" height="38" rx="19" fill="#141414" stroke="rgba(255,255,255,0.12)" />
      <circle cx="20" cy="19" r="4.5" fill="#3ddc97" />
      <!-- Mini receipt icon -->
      <g transform="translate(34, 10) scale(0.85)">
        <path d="M1 1h16v18l-2-1.6-2 1.6-2-1.6-2 1.6-2-1.6-2 1.6-2-1.6L1 19z" fill="#f2efe7" />
        <rect x="4" y="5" width="10" height="1.5" fill="#151515" />
        <rect x="4" y="8.2" width="7" height="1.5" fill="#151515" />
        <rect x="4" y="11.4" width="9" height="1.5" fill="#151515" />
      </g>
      <text x="60" y="24" fill="#ededed" font-family="monospace, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">RECEIPTS</text>
    </g>

    <!-- Main headline -->
    <text x="0" y="120" fill="#ededed" font-family="serif, Georgia, serif" font-size="56" font-weight="400" letter-spacing="-0.5">Don't trust.</text>
    <text x="0" y="182" fill="#f2efe7" font-family="serif, Georgia, serif" font-style="italic" font-size="56" font-weight="400" letter-spacing="-0.5">Check the receipt.</text>

    <!-- Subtitle description -->
    <text x="0" y="246" fill="#a1a1a1" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Every Solana token has a receipt.</text>
    <text x="0" y="278" fill="#8b877c" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Paste any token · One-page evidence card in seconds</text>
    <text x="0" y="304" fill="#6b6b6b" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">Team, repo, pulse, treasury &amp; wallet. Not opinions.</text>

    <!-- Feature pills -->
    <g transform="translate(0, 360)">
      <rect width="170" height="34" rx="17" fill="#151515" stroke="rgba(255,255,255,0.1)" />
      <text x="16" y="22" fill="#3ddc97" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1.2">● SOLANA MAINNET</text>

      <rect x="182" width="180" height="34" rx="17" fill="#151515" stroke="rgba(255,255,255,0.1)" />
      <text x="198" y="22" fill="#ededed" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1.2">✓ ZERO PAID BADGES</text>
    </g>

    <!-- Domain link -->
    <g transform="translate(0, 440)">
      <text x="0" y="24" fill="#ededed" font-family="monospace" font-size="18" font-weight="600" letter-spacing="1.5">receipts.xyz</text>
      <text x="160" y="24" fill="#6b6b6b" font-family="system-ui, sans-serif" font-size="15">· Every line links to its source</text>
    </g>
  </g>

  <!-- RIGHT: Rotated Paper Receipt -->
  <g transform="translate(690, 45) rotate(2.5 240 270)" filter="url(#card-shadow)">
    <!-- Paper background -->
    <path
      d="M 0 0 h 460 v 510 
         l -15 -12 -15 12 -15 -12 -15 12 -15 -12 -15 12 -15 -12 -15 12 
         -15 -12 -15 12 -15 -12 -15 12 -15 -12 -15 12 -15 -12 -15 12 
         -15 -12 -15 12 -15 -12 -15 12 -15 -12 -15 12 -15 -12 -15 12 
         -15 -12 -15 12 -15 -12 -15 12 -15 -12 -15 12 -15 -12 L 0 510 Z"
      fill="#f2efe7"
    />

    <!-- Header -->
    <text x="230" y="46" text-anchor="middle" fill="#151515" font-family="monospace" font-size="24" font-weight="900" letter-spacing="6">RECEIPTS</text>
    <text x="230" y="68" text-anchor="middle" fill="#8b877c" font-family="monospace" font-size="11" font-weight="600" letter-spacing="2">SOLANA EVIDENCE REPORT</text>
    
    <!-- Dashed rule -->
    <line x1="28" y1="84" x2="432" y2="84" stroke="#151515" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.3" />

    <!-- Token Meta -->
    <text x="28" y="112" fill="#151515" font-family="system-ui, sans-serif" font-size="22" font-weight="800"></text>
    <text x="96" y="112" fill="#666" font-family="system-ui, sans-serif" font-size="16" font-weight="500">Jupiter Exchange</text>
    <text x="432" y="112" text-anchor="end" fill="#3ddc97" font-family="monospace" font-size="13" font-weight="700">● VERIFIED</text>

    <!-- Dashed rule -->
    <line x1="28" y1="132" x2="432" y2="132" stroke="#151515" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.2" />

    <!-- Section checks -->
    <g transform="translate(28, 142)" font-family="monospace" font-size="14.5">
      <!-- Row 1: Team -->
      <text x="0" y="24" fill="#151515" font-weight="800" letter-spacing="2">TEAM</text>
      <text x="404" y="24" text-anchor="end" fill="#178a5c" font-weight="800">VERIFIED ✓</text>
      <text x="0" y="42" fill="#8b877c" font-size="11.5">3 co-founders proved via signed wallet</text>

      <!-- Row 2: Work -->
      <text x="0" y="78" fill="#151515" font-weight="800" letter-spacing="2">WORK</text>
      <text x="404" y="78" text-anchor="end" fill="#178a5c" font-weight="800">FOUND ✓</text>
      <text x="0" y="96" fill="#8b877c" font-size="11.5">Live product at jup.ag (HTTP 200)</text>

      <!-- Row 3: Pulse -->
      <text x="0" y="132" fill="#151515" font-weight="800" letter-spacing="2">PULSE</text>
      <text x="404" y="132" text-anchor="end" fill="#178a5c" font-weight="800">HEALTHY ●</text>
      <text x="0" y="150" fill="#8b877c" font-size="11.5">1,240 commits · active past 12 weeks</text>

      <!-- Row 4: Wallet -->
      <text x="0" y="186" fill="#151515" font-weight="800" letter-spacing="2">WALLET</text>
      <text x="404" y="186" text-anchor="end" fill="#178a5c" font-weight="800">REVOKED ✓</text>
      <text x="0" y="204" fill="#8b877c" font-size="11.5">Mint authority permanently disabled</text>
    </g>

    <!-- Dashed rule -->
    <line x1="28" y1="375" x2="432" y2="375" stroke="#151515" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.3" />

    <!-- Rubber stamp -->
    <g transform="translate(210, 424) rotate(-11)" filter="url(#stamp-rough)">
      <rect x="-100" y="-32" width="200" height="62" rx="8" fill="none" stroke="#178a5c" stroke-width="4" stroke-opacity="0.9" />
      <rect x="-95" y="-27" width="190" height="52" rx="5" fill="none" stroke="#178a5c" stroke-width="1.5" stroke-opacity="0.8" />
      <text x="0" y="4" text-anchor="middle" fill="#178a5c" font-family="monospace" font-size="21" font-weight="900" letter-spacing="3.5">STRONG</text>
      <text x="0" y="18" text-anchor="middle" fill="#178a5c" font-family="monospace" font-size="8.5" font-weight="700" letter-spacing="2">EVIDENCE · 11/11</text>
    </g>

    <!-- Barcode simulation -->
    <g transform="translate(36, 458)" fill="#151515">
      <rect x="0" y="0" width="3" height="24" />
      <rect x="5" y="0" width="2" height="24" />
      <rect x="9" y="0" width="6" height="24" />
      <rect x="18" y="0" width="2" height="24" />
      <rect x="23" y="0" width="4" height="24" />
      <rect x="30" y="0" width="1" height="24" />
      <rect x="34" y="0" width="5" height="24" />
      <rect x="42" y="0" width="3" height="24" />
      <rect x="48" y="0" width="2" height="24" />
      <rect x="53" y="0" width="7" height="24" />
      <rect x="63" y="0" width="2" height="24" />
      <rect x="68" y="0" width="4" height="24" />
      <rect x="75" y="0" width="2" height="24" />
      <rect x="80" y="0" width="5" height="24" />
      <rect x="88" y="0" width="2" height="24" />
      <rect x="93" y="0" width="6" height="24" />
      <rect x="102" y="0" width="2" height="24" />
      <rect x="107" y="0" width="3" height="24" />
    </g>
    <text x="424" y="474" text-anchor="end" fill="#8b877c" font-family="monospace" font-size="11">receipts.xyz</text>
  </g>
</svg>